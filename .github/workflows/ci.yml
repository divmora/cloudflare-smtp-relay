name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    strategy:
      matrix:
        node-version: ['20', '22', '24']
    uses: divmora/.github/.github/workflows/node-ci.yml@main
    with:
      node-version: ${{ matrix.node-version }}
      package-manager: 'pnpm'

