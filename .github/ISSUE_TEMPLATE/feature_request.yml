name: Feature Request
description: Suggest an idea or feature for Cloudflare SMTP Relay
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a new feature or improvement!
  - type: textarea
    id: description
    attributes:
      label: Feature Description
      description: A clear and concise description of the feature or improvement you would like.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement / Use Case
      description: What problem does this solve or what use case does this enable?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you have considered.
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or API examples here.
    validations:
      required: false
