services:
  smtp-relay:
    build:
      context: .
      dockerfile: Dockerfile
    image: cloudflare-smtp-relay
    container_name: cloudflare-smtp-relay
    restart: unless-stopped
    ports:
      # The relay accepts passwords without TLS: keep it off public interfaces.
      - "127.0.0.1:587:587"
    volumes:
      - ./config.yml:/app/config.yml:ro
    environment:
      - SMTP_RELAY_CONFIG_PATH=/app/config.yml
      # Optional: set the Cloudflare token here (or in an .env file) instead of config.yml
      # - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
