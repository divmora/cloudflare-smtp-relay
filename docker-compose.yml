services:
  smtp-relay:
    build:
      context: .
      dockerfile: Dockerfile
    image: cloudflare-smtp-relay
    container_name: cloudflare-smtp-relay
    restart: unless-stopped
    # Run as the unprivileged node user. Docker's default bridge network lets it bind
    # port 587; with network_mode: host it cannot (use smtp_port >= 1024 or drop this line).
    # config.yml must be readable by uid 1000.
    user: node
    ports:
      # The relay accepts passwords without TLS: keep it off public interfaces.
      - "127.0.0.1:587:587"
    volumes:
      - ./config.yml:/app/config.yml:ro
    environment:
      - SMTP_RELAY_CONFIG_PATH=/app/config.yml
      # Optional: set the Cloudflare token here (or in an .env file) instead of config.yml
      # - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
    healthcheck:
      # Adjust the port if you change health_port / health_host in config.yml.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
