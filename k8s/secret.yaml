# The config holds SMTP passwords, so it is stored in a Secret rather than a ConfigMap.
# The Cloudflare token is kept separately and passed as an environment variable,
# which takes precedence over cloudflare_api_token in config.yml.
apiVersion: v1
kind: Secret
metadata:
  name: smtp-relay-config
type: Opaque
stringData:
  config.yml: |
    global:
      smtp_host: "0.0.0.0"
      smtp_port: 587
      health_host: "0.0.0.0"
      health_port: 8080
      config_refresh_interval_ms: 300000
      cloudflare_account_id: "YOUR_ACCOUNT_ID"
      allowed_from_emails: []
      allowed_to_emails: []
      allowed_from_domains: []
      allowed_to_domains: []

    smtp_users:
      - username: "example_user"
        password: "example_password"
        allowed_from_emails: []
        allowed_to_emails: []
        allowed_from_domains: []
        allowed_to_domains: []
---
apiVersion: v1
kind: Secret
metadata:
  name: smtp-relay-cloudflare
type: Opaque
stringData:
  CLOUDFLARE_API_TOKEN: "YOUR_API_TOKEN"
