apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflare-smtp-relay
  labels:
    app: cloudflare-smtp-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflare-smtp-relay
  template:
    metadata:
      labels:
        app: cloudflare-smtp-relay
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        # Lets the non-root user bind port 587. A "safe" sysctl, allowed by default since
        # Kubernetes 1.22.
        sysctls:
        - name: net.ipv4.ip_unprivileged_port_start
          value: "0"
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: cloudflare-smtp-relay
        image: ghcr.io/divmora/cloudflare-smtp-relay:1.1.4 # x-release-please-version
        ports:
        - containerPort: 587
          name: smtp
        - containerPort: 8080
          name: health
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
        env:
        - name: SMTP_RELAY_CONFIG_PATH
          value: "/app/config.yml"
        - name: CLOUDFLARE_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: smtp-relay-cloudflare
              key: CLOUDFLARE_API_TOKEN
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: config-volume
          mountPath: /app/config.yml
          subPath: config.yml
          readOnly: true
      volumes:
      - name: config-volume
        secret:
          secretName: smtp-relay-config
