# ClusterIP on purpose: the relay accepts SMTP passwords without TLS, so it should only be
# reachable from inside the cluster. Do not change this to a LoadBalancer.
apiVersion: v1
kind: Service
metadata:
  name: cloudflare-smtp-relay
spec:
  type: ClusterIP
  selector:
    app: cloudflare-smtp-relay
  ports:
    - name: smtp
      protocol: TCP
      port: 587
      targetPort: smtp
